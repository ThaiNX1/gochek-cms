<a
  [routerLink]="['/shop/products']"
  [queryParams]="{ category: category.id }"
  class="flex flex-col items-center justify-center p-4 rounded-xl border border-gray-200 bg-white hover:shadow-md hover:border-blue-500 transition-all duration-300 group"
>
  <div class="text-4xl mb-2 group-hover:scale-110 transition-transform duration-300">
    {{ category.icon }}
  </div>
  <span class="text-sm font-medium text-gray-700 text-center group-hover:text-blue-600">
    {{ category.name }}
  </span>
</a>
