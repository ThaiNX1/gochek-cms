<a [routerLink]="['/shop/products', product.slug]"
  class="block rounded-2xl border border-gray-200 bg-white hover:shadow-md transition-shadow duration-300 p-3 group">
  <div class="relative aspect-square mb-3 overflow-hidden rounded-xl bg-gray-100">
    <img [src]="product.images[0]" [alt]="product.name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" />
    <div *ngIf="discountPercent > 0" class="absolute top-2 left-2">
      <span class="bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-md">
        -{{ discountPercent }}%
      </span>
    </div>
    <div *ngIf="product.tags && product.tags.length > 0" class="absolute top-2 right-2 flex gap-1">
      <span *ngFor="let tag of product.tags" class="text-xs font-semibold px-2 py-1 rounded-md" [ngClass]="{
          'bg-orange-500 text-white': tag === 'hot',
          'bg-primary text-white': tag === 'new'
        }">
        {{ tag === 'hot' ? 'HOT' : 'MỚI' }}
      </span>
    </div>
  </div>

  <h3 class="text-sm font-medium text-gray-900 line-clamp-2 mb-2 min-h-[2.5rem]">
    {{ product.name }}
  </h3>

  <div class="flex items-center gap-2 mb-2" *ngIf="product.rating">
    <div class="flex items-center">
      <span class="text-yellow-400 text-sm">★</span>
      <span class="text-xs text-gray-600 ml-1">{{ product.rating }}</span>
    </div>
    <span class="text-xs text-gray-400">|</span>
    <span class="text-xs text-gray-600">Đã bán {{ product.sold }}</span>
  </div>

  <div class="flex items-baseline gap-2">
    <span class="text-lg font-bold text-red-600">
      {{ (product.salePrice || product.price) | number: '1.0-0' }}₫
    </span>
    <span *ngIf="product.salePrice" class="text-sm text-gray-400 line-through">
      {{ product.price | number: '1.0-0' }}₫
    </span>
  </div>
</a>
