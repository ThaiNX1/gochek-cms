<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm shadow-sm">
  <div class="container mx-auto px-3 sm:px-4 lg:px-6">
    <div class="flex items-center justify-between py-4">
      <a routerLink="/shop" class="flex items-center gap-2">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-blue-400 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-xl">T</span>
        </div>
        <span class="text-xl font-bold text-gray-900 hidden sm:block">Tech Store</span>
      </a>
      <div class="hidden md:flex flex-1 max-w-2xl mx-8">
        <div class="relative w-full">
          <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="search()" placeholder="Tìm kiếm sản phẩm..." class="w-full px-4 py-2 pr-12 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          <button (click)="search()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center hover:bg-blue-700 transition-colors">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button (click)="toggleMobileSearch()" class="md:hidden w-10 h-10 flex items-center justify-center text-gray-700 hover:text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        </button>
        <button class="relative w-10 h-10 flex items-center justify-center text-gray-700 hover:text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
          <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
        </button>
        <button (click)="toggleMobileMenu()" class="lg:hidden w-10 h-10 flex items-center justify-center text-gray-700">
          <svg *ngIf="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          <svg *ngIf="mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
    </div>
    <div *ngIf="mobileSearchOpen" class="md:hidden pb-4">
      <div class="relative">
        <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="search()" placeholder="Tìm kiếm sản phẩm..." class="w-full px-4 py-2 pr-12 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button (click)="search()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        </button>
      </div>
    </div>
    <nav class="hidden lg:flex items-center gap-8 py-3 border-t border-gray-200">
      <a routerLink="/shop" routerLinkActive="text-blue-600 font-semibold" [routerLinkActiveOptions]="{ exact: true }" class="text-gray-700 hover:text-blue-600 transition-colors">Trang chủ</a>
      <a routerLink="/shop/products" routerLinkActive="text-blue-600 font-semibold" class="text-gray-700 hover:text-blue-600 transition-colors">Sản phẩm</a>
      <a routerLink="/shop/store" routerLinkActive="text-blue-600 font-semibold" class="text-gray-700 hover:text-blue-600 transition-colors">Cửa hàng</a>
    </nav>
  </div>
  <div *ngIf="mobileMenuOpen" class="lg:hidden border-t border-gray-200 bg-white">
    <nav class="container mx-auto px-3 py-4 flex flex-col gap-4">
      <a routerLink="/shop" (click)="closeMobileMenu()" routerLinkActive="text-blue-600 font-semibold" [routerLinkActiveOptions]="{ exact: true }" class="text-gray-700 hover:text-blue-600 transition-colors py-2">Trang chủ</a>
      <a routerLink="/shop/products" (click)="closeMobileMenu()" routerLinkActive="text-blue-600 font-semibold" class="text-gray-700 hover:text-blue-600 transition-colors py-2">Sản phẩm</a>
      <a routerLink="/shop/store" (click)="closeMobileMenu()" routerLinkActive="text-blue-600 font-semibold" class="text-gray-700 hover:text-blue-600 transition-colors py-2">Cửa hàng</a>
    </nav>
  </div>
</header>
