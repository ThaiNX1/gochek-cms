<div class="w-full h-full flex flex-col items-center justify-center gap-3">
  @if (isLoading()) {
  <div class="w-full h-full fixed top-0 left-0 bg-gray-300 flex items-center justify-center opacity-60"
    [style.z-index]="1001"></div>
  <div class="w-full h-full fixed top-0 left-0 bg-transparent flex items-center justify-center" [style.z-index]="1002">
    <div class="spinner-color-loop">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
  }
  <div class="flex flex-col items p-0 md:p-20 md:shadow-lg md:border-2 md:border-gray-200 md:rounded-lg gap-5">
    <div class="flex flex-col items-center justify-center gap-4">
      <img class="w-52 h-auto object-contain" src="assets/images/logo_neutral.svg" />
      <p class="text-center text-gray-500">Nhập mã OTP đã được gửi đến email của bạn</p>
    </div>
    <form [formGroup]="otpForm" (ngSubmit)="handleConfirmOtp()"
      class="flex flex-col items-stretch justify-center gap-5 p-3">
      <div class="w-full md:w-[350px] flex items-stretch justify-center gap-3">
        <mat-form-field floatLabel="auto" appearance="outline">
          <input matInput type="number" class="no-spinner text-center" formControlName="number1" #number1
            (input)="onInput($event, number2)" />
        </mat-form-field>
        <mat-form-field floatLabel="auto" appearance="outline">
          <input matInput type="number" class="no-spinner text-center" formControlName="number2" #number2
            (input)="onInput($event, number3)" />
        </mat-form-field>
        <mat-form-field floatLabel="auto" appearance="outline">
          <input matInput type="number" class="no-spinner text-center" formControlName="number3" #number3
            (input)="onInput($event, number4)" />
        </mat-form-field>
        <mat-form-field floatLabel="auto" appearance="outline">
          <input matInput type="number" class="no-spinner text-center" formControlName="number4" #number4
            (input)="onInput($event, number5)" />
        </mat-form-field>
        <mat-form-field floatLabel="auto" appearance="outline">
          <input matInput type="number" class="no-spinner text-center" formControlName="number5" #number5
            (input)="onInput($event, number6)" />
        </mat-form-field>
        <mat-form-field floatLabel="auto" appearance="outline">
          <input matInput type="number" class="no-spinner text-center" formControlName="number6" #number6 />
        </mat-form-field>
      </div>

      <div class="flex items-center justify-center gap-2">
        <button type="button" class="text-blue-300 bg-transparent border-none outline-none" (click)="resendOtp()">
          Gửi lại mã OTP
        </button>
      </div>

      <div class="flex items-center justify-center py-3">
        <button type="submit" class="w-full text-center bg-primary text-white border-none border-round">
          Đăng nhập
        </button>
      </div>
    </form>
  </div>
</div>
