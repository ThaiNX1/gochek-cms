<div class="flex-1 flex flex-col items-stretch justify-start overflow-auto gray-500-scroll gap-3">
    <div class="flex items-center justify-between px-4">
        <div class="flex-1 flex flex-col md:flex-row items-center justify-start gap-3">
            <h1 class="text-2xl font-bold">Danh sách khách hàng</h1>
            <form [formGroup]="filterForm" class="flex flex-col md:flex-row items-center justify-start gap-3">
                <mat-form-field appearance="outline" floatLabel="auto" class="w-full md:w-[300px] bg-white">
                    <input matInput formControlName="keyword" placeholder="Nhập để tìm kiếm" />
                </mat-form-field>
            </form>
        </div>
    </div>
    <app-table
        class="flex-1 flex flex-col items-stretch justify-start overflow-auto bg-white rounded-md border border-gray-400 p-4"
        [columns]="displayedColumns" [dataSource]="dataSource" [pagination]="pagination"
        (pageChange)="onPageChange($event)">
    </app-table>
</div>

<ng-template myTemplate tempCode="phoneColumnTemplate" let-item="item">
    <div class="flex items-center justify-start px-4 gap-2">
        <span>{{ item.phone }}</span>
        @if(item.phone) {
        <button class="flex items-center justify-center border-none bg-transparent" (click)="onCall3cx(item.phone)">
            <mat-icon class="text-green-600">phone</mat-icon>
        </button>
        }
    </div>
</ng-template>

<ng-template myTemplate tempCode="statusColumnTemplate" let-item="item">
    <div class="flex items-center justify-start px-4">
        <button 
            (click)="onChangeStatus(item)"
            class="px-2 py-1 rounded text-xs font-medium cursor-pointer border-none"
            [ngClass]="getStatusClass(item.status)">
            {{ getStatusLabel(item.status) }}
        </button>
    </div>
</ng-template>

<ng-template myTemplate tempCode="actionColumnTemplate" let-item="item">
    <div class="flex items-center justify-center px-4 gap-3">
        <button class="flex items-center justify-center border-none bg-transparent" (click)="onChangeStatus(item)">
            <mat-icon class="text-gray-500">edit</mat-icon>
        </button>
    </div>
</ng-template>

<!-- Dialog Template -->
<ng-template #customerDialogContent>
    <div class="w-full flex flex-col gap-4">
        <p class="w-full text-center">
            {{ dialogData.message }}
        </p>
        <mat-form-field appearance="outline" floatLabel="auto" class="w-full">
            <mat-label>Trạng thái</mat-label>
            <mat-select [(ngModel)]="selectedStatus">
                @for (status of customerStatuses; track status.value) {
                <mat-option [value]="status.value">{{ status.label }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </div>
</ng-template>
