<div class="flex flex-1 min-h-0 flex-col overflow-hidden">
    <div class="flex items-center border-b border-gray-200 bg-white px-4 py-3">
        <mat-button-toggle-group class="dashboard-toggle" [value]="selectedDashboard"
            [hideSingleSelectionIndicator]="true" aria-label="Chọn bảng điều khiển"
            (change)="onSelectDashboard($event.value)">
            <mat-button-toggle value="overview">
                <span class="dashboard-toggle-label">
                    <mat-icon>space_dashboard</mat-icon>
                    Tổng quan
                </span>
            </mat-button-toggle>
            <mat-button-toggle value="manufacturing-management" [disabled]="!canViewManufacturingDashboard"
                title="Bảng điều khiển này yêu cầu quyền quản lý thiết bị">
                <span class="dashboard-toggle-label">
                    <mat-icon>precision_manufacturing</mat-icon>
                    Quản lý sản xuất
                </span>
            </mat-button-toggle>
        </mat-button-toggle-group>
    </div>

    <div class="flex flex-1 min-h-0 flex-col overflow-auto gray-500-scroll p-4">
        @switch(selectedDashboard) {
            @case('manufacturing-management') {
                <app-manufacturing-management-dashboard />
            }
            @default {
                <app-overview-dashboard />
            }
        }
    </div>
</div>
