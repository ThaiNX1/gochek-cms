<div class="flex-1 flex flex-col items-stretch justify-start overflow-auto gray-500-scroll">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-300 bg-white">
        <div class="flex items-center gap-3">
            <button class="flex items-center justify-center border-none bg-transparent" (click)="onCancel()">
                <mat-icon class="text-gray-600">arrow_back</mat-icon>
            </button>
            <h1 class="text-2xl font-bold">{{ isEditMode ? 'Chỉnh sửa banner' : 'Thêm banner' }}</h1>
        </div>
        <div class="flex items-center gap-3">
            <button class="flex items-center justify-center gap-2 px-4 py-2 bg-white border border-gray-400 rounded"
                (click)="onCancel()">
                Hủy
            </button>
            <button class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-500 text-white rounded"
                (click)="onSave()">
                <mat-icon class="text-white">save</mat-icon>
                {{ isEditMode ? 'Cập nhật' : 'Lưu' }}
            </button>
        </div>
    </div>

    <div class="flex-1 overflow-auto gray-500-scroll p-4">
        <form [formGroup]="bannerForm" class="max-w-4xl mx-auto flex flex-col gap-6">
            
            <!-- Thông tin banner -->
            <div class="bg-white rounded-lg border border-gray-300 p-4">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-200">Thông tin banner</h2>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="require font-medium">Tiêu đề</label>
                        <mat-form-field appearance="outline" floatLabel="auto">
                            <input matInput formControlName="title" placeholder="Nhập tiêu đề banner">
                        </mat-form-field>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="require font-medium">Thứ tự hiển thị</label>
                            <mat-form-field appearance="outline" floatLabel="auto">
                                <input matInput type="number" formControlName="order" placeholder="Nhập thứ tự">
                            </mat-form-field>
                        </div>
                        
                        <div class="flex flex-col gap-1">
                            <label class="font-medium">Vị trí hiển thị</label>
                            <mat-form-field appearance="outline" floatLabel="auto">
                                <mat-select formControlName="page">
                                    @for (page of ownerPages; track page.value) {
                                    <mat-option [value]="page.value">{{ page.label }}</mat-option>
                                    }
                                </mat-select>
                            </mat-form-field>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="font-medium">Trạng thái</label>
                            <mat-checkbox formControlName="isActive" class="mt-3">
                                Hiển thị banner
                            </mat-checkbox>
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="font-medium">Liên kết</label>
                        <mat-form-field appearance="outline" floatLabel="auto">
                            <input matInput formControlName="redirectUrl" placeholder="Nhập liên kết">
                        </mat-form-field>
                    </div>
                </div>
            </div>

            <!-- Hình ảnh banner -->
            <div class="bg-white rounded-lg border border-gray-300 p-4">
                <h2 class="text-lg font-semibold mb-4 pb-2 border-b border-gray-200">Hình ảnh banner</h2>
                <div class="flex flex-col gap-2">
                    <p class="text-sm text-gray-600">Kích thước đề xuất: 1920x600px, tối đa 5MB</p>
                    @if(imagePreview) {
                        <div class="relative w-full max-w-2xl border border-gray-300 rounded overflow-hidden min-h-20">
                            <img [src]="imagePreview" alt="Banner preview" class="w-full h-auto object-cover">
                            <button type="button" 
                                class="absolute w-7 !h-7 top-2 right-2 bg-red-500 text-white rounded-full flex items-center justify-center hover:bg-red-600"
                                (click)="removeImage()">
                                <mat-icon class="text-sm text-white">close</mat-icon>
                            </button>
                        </div>
                    } @else {
                        <label class="w-full max-w-2xl h-48 border-2 border-dashed border-gray-300 rounded flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-50">
                            <mat-icon class="text-gray-400 text-5xl">add_photo_alternate</mat-icon>
                            <span class="text-sm text-gray-500 mt-2">Click để chọn ảnh</span>
                            <input type="file" 
                                class="hidden" 
                                accept="image/*" 
                                (change)="onImageChange($event)">
                        </label>
                    }
                </div>
            </div>

        </form>
    </div>
</div>
