<div class="select-search-container">
  <!-- @if(ngControl.invalid && ngControl.touched) {
    <div class="error-message">
      {{ ngControl.errors | json }}
    </div>
  } -->
  <mat-form-field appearance="outline" [floatLabel]="'auto'" class="w-full"
    [ngClass]="{'form-field-invalid': ngControl.invalid && ngControl.touched}">
    @if(matLabel.length) {
      <mat-label>{{ matLabel }}</mat-label>
    }
    <mat-select
      [formControl]="formControl"
      [multiple]="multiple"
      [disabled]="disabled"
      (selectionChange)="onValueChange($event.value)"
      [placeholder]="placeholder">
      
      <!-- Search input -->
      <div class="search-container">
        <mat-form-field appearance="outline" floatLabel="auto" class="search-field w-full p-2">
          <input matInput
                 [formControl]="searchControl"
                 placeholder="Nhập tìm kiếm..."
                 (keydown)="$event.stopPropagation()">
          @if(searchControl.value) {
            <button matSuffix
                    class="bg-transparent border-none flex items-center justify-center min-h-0 p-0"
                    (click)="clearSearch()"
                    (keydown)="$event.stopPropagation()">
              <mat-icon>close</mat-icon>
            </button>
          }
        </mat-form-field>
      </div>

      <!-- Loading spinner -->
      @if(isLoading) {
        <div class="loading-container">
          <mat-spinner diameter="24"></mat-spinner>
        </div>
      } @else {
        <!-- No data message -->
        @if(!options.length) {
          <mat-option [value]="null" disabled>
            <div class="w-full flex items-center justify-center gap-3">
              <mat-icon>folder</mat-icon>
              <span>Không có dữ liệu</span>
            </div>
          </mat-option>
        } @else {
          <!-- Options -->
          @for(option of options; track option[valueKey]) {
            <mat-option [value]="option[valueKey]">
              {{ getDisplayValue(option) }}
              </mat-option>
            }
          }
      }
    </mat-select>
    @if(clearable && formControl.value) {
      <button matSuffix
              class="bg-transparent border-none flex items-center justify-center min-h-0 p-0"
              (click)="clearSelectedValue()"
              (keydown)="$event.stopPropagation()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
</div>
